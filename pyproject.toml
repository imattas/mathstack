[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathstack"
version = "3.2.1"
description = "MathCore Advanced - Advanced Mathematics Library with zero external dependencies. Includes symbolic algebra, geometry, calculus, statistics, optimization, probability distributions, complex numbers, and differential equation solvers."
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    {name = "MathCore Contributors", email = "info@mathcore.dev"}
]
keywords = [
    "mathematics",
    "algebra",
    "geometry",
    "calculus",
    "symbolic",
    "polynomial",
    "matrix",
    "linear-algebra",
    "advanced-math",
    "scientific-computing",
    "statistics",
    "optimization",
    "no-dependencies",
    "pure-python"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/imattas/mathstack"
Repository = "https://github.com/imattas/mathstack.git"
Issues = "https://github.com/imattas/mathstack/issues"

[tool.setuptools]
packages = ["mathcore", "mathcore.core", "mathcore.utils", "mathcore.statistics", 
           "mathcore.optimization", "mathcore.complex",
           "mathcore.probability", "mathcore.differential",
           "mathcore.geometry", "mathcore.trigonometry"]

[tool.setuptools.package-data]
mathcore = ["py.typed"]
